name: KPC Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run ETL Pipeline (Extraction -> Transformation -> Load)
      run: |
        python extract.py
        python transform.py
        python load.py

    - name: Train Inuka ML Models
      run: |
        python train_ml_models.py

    - name: Run Unit Tests
      run: |
        python -m pytest tests/
